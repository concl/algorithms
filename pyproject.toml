[project]
name = "algorithms"
version = "0.1.0"
description = "Algorithms and data structures implementations with tests"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "debugpy",
    "latexminted>=0.7.1",
    "numpy>=2.4.4",
    "pygments>=2.20.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers"]
